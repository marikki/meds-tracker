# /etc/nginx/sites-available/meds.marikkish.com
# Після підключення:  sudo certbot --nginx -d meds.marikkish.com
# certbot сам додасть listen 443, сертифікат і редирект з HTTP.
server {
    listen 80;
    server_name meds.marikkish.com;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # PWA: service worker і manifest повинні завжди йти свіжі,
    # щоб оновлення застосунку доходили до клієнтів без лагу.
    location = /sw.js {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.webmanifest {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ліміт спроб входу. Зона `login` описана в /etc/nginx/conf.d/login-ratelimit.conf:
    #   limit_req_zone "$binary_remote_addr$host" zone=login:10m rate=5r/m;
    #   limit_req_status 429;
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
