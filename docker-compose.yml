services:
  meds:
    build: .
    container_name: meds-tracker
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3005:3004"
    volumes:
      - ./data:/app/data          # meds.db + backups/ — саме цей файл потім підключить FamilyHub
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
